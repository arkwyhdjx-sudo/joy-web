<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOY.CC</title>

  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-pro-display">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07060b;
      --surface: #0f0d17;
      --surface-elevated: #151322;
      --border: #221d33;
      --accent: #8b5cf6;
      --accent-bright: #a855f7;
      --accent-glow: rgba(139, 92, 246, 0.25);
      --accent-glow-intense: rgba(168, 85, 247, 0.45);
      --text-main: #f3f2f8;
      --text-muted: #726c8a;
      --radius: 10px;
      --font-main: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-main);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    .ambient-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.4;
    }

    .glow-1 { top: -15%; left: 20%; width: 500px; height: 500px; background: radial-gradient(circle, var(--accent) 0%, transparent 70%); }
    .glow-2 { bottom: 5%; right: 10%; width: 600px; height: 600px; background: radial-gradient(circle, #5b21b6 0%, transparent 70%); }

    .mono { font-family: var(--font-mono); }
    .text-muted { color: var(--text-muted); }
    .fw-600 { font-weight: 600; }
    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    input, textarea, select {
      width: 100%;
      background: rgba(15, 13, 23, 0.7);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: var(--radius);
      outline: none;
      font-size: 14px;
      font-family: var(--font-main);
      transition: border-color 0.2s;
    }

    textarea { resize: vertical; min-height: 80px; }
    input:focus, textarea:focus { border-color: var(--accent-bright); }

    button {
      font-family: var(--font-main);
      font-weight: 600;
      font-size: 13.5px;
      border: none;
      border-radius: var(--radius);
      padding: 11px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-violet {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-bright) 100%);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn-violet:hover { box-shadow: 0 6px 25px var(--accent-glow-intense); transform: translateY(-1px); }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
    }
    .btn-outline:hover { border-color: var(--accent); background: rgba(139, 92, 246, 0.08); }

    /* Минималистичный лоадер без текста */
    #ddos-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    #ddos-screen.verified { opacity: 0; visibility: hidden; pointer-events: none; }

    .loader {
      width: 44px;
      height: 44px;
      border: 2px solid transparent;
      border-top-color: var(--accent-bright);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Авторизация */
    #auth-screen {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    .brand-title {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 0.08em;
      text-align: center;
      margin-bottom: 24px;
      background: linear-gradient(180deg, #fff 40%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-tabs {
      display: flex;
      background: rgba(7, 6, 11, 0.6);
      padding: 4px;
      border-radius: var(--radius);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      background: transparent;
      color: var(--text-muted);
      padding: 8px 0;
      font-size: 13px;
      border-radius: 6px;
    }
    .auth-tab.active { color: #fff; background: var(--surface-elevated); }

    .auth-form { display: none; }
    .auth-form.active { display: block; }

    /* Панель */
    #dashboard-screen {
      position: relative;
      z-index: 10;
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }

    header.top-nav {
      background: rgba(15, 13, 23, 0.95);
      border-bottom: 1px solid var(--border);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-left, .nav-right { display: flex; align-items: center; gap: 32px; }
    .nav-links { display: flex; gap: 20px; }

    .nav-link {
      background: none;
      color: var(--text-muted);
      font-size: 14px;
      padding: 6px 0;
      position: relative;
    }
    .nav-link:hover, .nav-link.active { color: var(--text-main); }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -19px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .main-content {
      flex-grow: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .section { display: none; }
    .section.active { display: block; }

    /* СТИЛИ ПРОФИЛЯ */
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    .profile-header-banner {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .profile-sub-tabs {
      display: flex;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      padding-bottom: 8px;
    }

    .profile-sub-tab {
      background: none;
      color: var(--text-muted);
      font-size: 13.5px;
      padding: 6px 12px;
    }
    .profile-sub-tab.active {
      color: #fff;
      background: var(--surface-elevated);
      border-radius: var(--radius);
    }

    .sub-view { display: none; }
    .sub-view.active { display: block; }

    .color-picker {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .color-opt {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-opt.active { border-color: #fff; }

    /* ФОРУМ И ТИКЕТЫ */
    .forum-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .forum-item:hover { border-color: var(--accent); background: var(--surface-elevated); }

    .ticket-badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface-elevated);
      border: 1px solid var(--accent);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: var(--radius);
      font-size: 13px;
      z-index: 1000;
      transform: translateY(100px);
      transition: all 0.3s ease;
    }
    #toast.show { transform: translateY(0); }
  </style>
</head>
<body>

  <div class="ambient-container">
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
  </div>

  <div id="ddos-screen"><div class="loader"></div></div>

  <!-- АВТОРИЗАЦИЯ -->
  <div id="auth-screen">
    <div class="auth-box">
      <div class="brand-title">JOY.CC</div>
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('login')">Вход</button>
        <button class="auth-tab" onclick="switchAuthTab('register')">Регистрация</button>
      </div>

      <form id="form-login" class="auth-form active" onsubmit="apiLogin(event)">
        <div class="form-group">
          <label>Логин</label>
          <input type="text" id="login-username" required>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="btn-violet" style="width: 100%;">Войти</button>
      </form>

      <form id="form-register" class="auth-form" onsubmit="apiRegister(event)">
        <div class="form-group">
          <label>Инвайт-код</label>
          <input type="text" id="reg-invite" class="mono" placeholder="JOY-XXXX-XXXX" required>
        </div>
        <div class="form-group">
          <label>Логин</label>
          <input type="text" id="reg-username" required>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="reg-p1" required>
        </div>
        <div class="form-group">
          <label>Подтверждение пароля</label>
          <input type="password" id="reg-p2" required>
        </div>
        <button type="submit" class="btn-violet" style="width: 100%;">Зарегистрироваться</button>
      </form>
    </div>
  </div>

  <!-- ДЭШБОРД -->
  <div id="dashboard-screen">
    <header class="top-nav">
      <div class="nav-left">
        <div class="brand-title" style="margin: 0; font-size: 18px;">JOY.CC</div>
        <nav class="nav-links">
          <button class="nav-link active" onclick="switchNav('profile')">Профиль</button>
          <button class="nav-link" onclick="switchNav('forum')">Форум</button>
          <button class="nav-link" onclick="switchNav('support')">Поддержка</button>
          <button class="nav-link" onclick="switchNav('sub')">Подписка</button>
        </nav>
      </div>
      <div class="nav-right">
        <button class="btn-outline" style="padding: 6px 12px; font-size: 12px;" onclick="apiLogout()">Выйти</button>
      </div>
    </header>

    <main class="main-content">
      <!-- ПРОФИЛЬ -->
      <section id="sec-profile" class="section active">
        <div class="profile-card">
          <div class="profile-header-banner">
            <div id="prof-avatar" class="profile-avatar">U</div>
            <div>
              <h2 id="prof-username" style="font-size: 20px; font-weight: 700;">User</h2>
              <div id="prof-invite" class="mono text-muted" style="font-size: 12px;">JOY-XXXX-XXXX</div>
            </div>
          </div>

          <div class="profile-sub-tabs">
            <button class="profile-sub-tab active" onclick="switchProfileSub('overview')">Обзор</button>
            <button class="profile-sub-tab" onclick="switchProfileSub('settings')">Настройки</button>
            <button class="profile-sub-tab" onclick="switchProfileSub('security')">Безопасность (HWID)</button>
          </div>

          <!-- Обзор профиля -->
          <div id="sub-overview" class="sub-view active">
            <div class="form-group">
              <label>Описание</label>
              <p id="prof-bio-text" class="text-muted" style="margin-bottom: 20px; font-size: 13.5px;">—</p>
            </div>
            <button class="btn-violet" onclick="downloadClient()">Скачать лаунчер (JoyLoader.exe)</button>
          </div>

          <!-- Настройки био и цвета -->
          <div id="sub-settings" class="sub-view">
            <div class="form-group">
              <label>Цвет аватарки</label>
              <div class="color-picker">
                <div class="color-opt active" style="background: #8b5cf6;" onclick="selectColor('#8b5cf6', this)"></div>
                <div class="color-opt" style="background: #ef4444;" onclick="selectColor('#ef4444', this)"></div>
                <div class="color-opt" style="background: #3b82f6;" onclick="selectColor('#3b82f6', this)"></div>
                <div class="color-opt" style="background: #10b981;" onclick="selectColor('#10b981', this)"></div>
                <div class="color-opt" style="background: #f59e0b;" onclick="selectColor('#f59e0b', this)"></div>
              </div>
            </div>
            <div class="form-group">
              <label>О себе</label>
              <textarea id="edit-bio" placeholder="Расскажите о себе..."></textarea>
            </div>
            <button class="btn-violet" onclick="apiSaveProfile()">Сохранить изменения</button>
          </div>

          <!-- HWID -->
          <div id="sub-security" class="sub-view">
            <p class="text-muted" style="margin-bottom: 12px;">Привязка оборудования лаунчера:</p>
            <div id="prof-hwid" class="mono text-muted" style="background: #000; padding: 12px; border-radius: var(--radius); margin-bottom: 16px;">
              Не привязано
            </div>
            <button class="btn-outline" onclick="apiResetHWID()">Сбросить HWID</button>
          </div>
        </div>
      </section>

      <!-- ФОРУМ -->
      <section id="sec-forum" class="section">
        <div id="forum-index">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-size: 20px;">Темы форума</h2>
            <button class="btn-violet" onclick="toggleNewThread()">Новая тема</button>
          </div>

          <div id="new-thread-form" style="display: none; background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: var(--radius); margin-bottom: 20px;">
            <div class="form-group">
              <label>Заголовок</label>
              <input type="text" id="t-title">
            </div>
            <div class="form-group">
              <label>Сообщение</label>
              <textarea id="t-content"></textarea>
            </div>
            <button class="btn-violet" onclick="apiCreateThread()">Создать</button>
          </div>

          <div id="forum-threads-list"></div>
        </div>

        <div id="forum-view" style="display: none;">
          <button class="btn-outline" style="margin-bottom: 16px;" onclick="backToThreads()">← Назад к темам</button>
          <h2 id="view-t-title" style="margin-bottom: 16px;"></h2>
          <div id="view-t-posts"></div>
          <div class="profile-card" style="margin-top: 20px;">
            <label>Ответить в тему</label>
            <textarea id="reply-text" style="margin-bottom: 12px;"></textarea>
            <button class="btn-violet" onclick="apiReplyThread()">Отправить ответ</button>
          </div>
        </div>
      </section>

      <!-- ПОДДЕРЖКА / ВОПРОСЫ -->
      <section id="sec-support" class="section">
        <div class="profile-card">
          <h2 style="font-size: 18px; margin-bottom: 8px;">Анонимная поддержка</h2>
          <p class="text-muted" style="margin-bottom: 20px;">
            Задайте вопрос разработчикам. Ваш тикет отправляется в защищенную очередь, а ответ будет доставлен прямо сюда.
          </p>
          <div class="form-group">
            <label>Тема обращения</label>
            <input type="text" id="ticket-subj" placeholder="Вопрос по билду или аккаунту...">
          </div>
          <div class="form-group">
            <label>Сообщение</label>
            <textarea id="ticket-msg" placeholder="Опишите подробно ваш вопрос..."></textarea>
          </div>
          <button class="btn-violet" onclick="apiSendTicket()">Отправить обращение</button>
        </div>

        <div class="profile-card">
          <h3 style="font-size: 15px; margin-bottom: 14px;">Ваши обращения</h3>
          <div id="tickets-list"></div>
        </div>
      </section>

      <!-- ПОДПИСКА -->
      <section id="sec-sub" class="section">
        <h2 style="font-size: 20px; margin-bottom: 20px;">Тарифные периоды</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px;">
          <div class="profile-card" style="text-align: center;">
            <div class="text-muted" style="margin-bottom: 8px;">1 месяц</div>
            <div class="mono" style="font-size: 24px; font-weight: 700; margin-bottom: 16px;">900 ₽</div>
            <button class="btn-outline" style="width: 100%; opacity: 0.5;" disabled>Недоступно</button>
          </div>
          <div class="profile-card" style="text-align: center;">
            <div class="text-muted" style="margin-bottom: 8px; color: var(--accent-bright);">3 месяца</div>
            <div class="mono" style="font-size: 24px; font-weight: 700; margin-bottom: 16px;">2 300 ₽</div>
            <button class="btn-outline" style="width: 100%; opacity: 0.5;" disabled>Недоступно</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast"></div>

  <script>
    let activeThreadId = null;
    let selectedColor = '#8b5cf6';

    function triggerToast(m) {
      const t = document.getElementById('toast');
      t.innerText = m;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      if (tab === 'login') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('form-login').classList.add('active');
      } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('form-register').classList.add('active');
      }
    }

    function switchNav(sec) {
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      event.target.classList.add('active');
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById('sec-' + sec).classList.add('active');

      if (sec === 'forum') loadThreads();
      if (sec === 'support') loadTickets();
    }

    function switchProfileSub(sub) {
      document.querySelectorAll('.profile-sub-tab').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      document.querySelectorAll('.sub-view').forEach(v => v.classList.remove('active'));
      document.getElementById('sub-' + sub).classList.add('active');
    }

    function selectColor(color, el) {
      selectedColor = color;
      document.querySelectorAll('.color-opt').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try { await fetch('/api/verify-ip'); } catch (e) {}
      setTimeout(() => document.getElementById('ddos-screen').classList.add('verified'), 400);

      const token = localStorage.getItem('token');
      if (token) loadUserProfile();
    });

    async function apiLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.message);

        localStorage.setItem('token', d.token);
        renderUser(d.user);
      } catch (err) { triggerToast(err.message); }
    }

    async function apiRegister(e) {
      e.preventDefault();
      const invite_code = document.getElementById('reg-invite').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const p1 = document.getElementById('reg-p1').value;
      const p2 = document.getElementById('reg-p2').value;

      if (p1 !== p2) return triggerToast('Пароли не совпадают');

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ invite_code, username, password: p1 })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.message);

        localStorage.setItem('token', d.token);
        renderUser(d.user);
      } catch (err) { triggerToast(err.message); }
    }

    async function loadUserProfile() {
      const token = localStorage.getItem('token');
      try {
        const res = await fetch('/api/profile', { headers: { 'Authorization': `Bearer ${token}` } });
        if (!res.ok) throw new Error();
        const d = await res.json();
        renderUser(d.user);
      } catch (e) { apiLogout(); }
    }

    function renderUser(u) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('dashboard-screen').style.display = 'flex';

      document.getElementById('prof-username').innerText = u.username;
      document.getElementById('prof-invite').innerText = u.invite_code;
      document.getElementById('prof-bio-text').innerText = u.bio || 'Описание не заполнено.';
      document.getElementById('edit-bio').value = u.bio || '';

      const avatar = document.getElementById('prof-avatar');
      avatar.innerText = u.username.charAt(0).toUpperCase();
      avatar.style.background = u.avatar_color || '#8b5cf6';

      document.getElementById('prof-hwid').innerText = u.hwid || 'Ожидает запуска клиента';
    }

    async function apiSaveProfile() {
      const token = localStorage.getItem('token');
      const bio = document.getElementById('edit-bio').value;

      try {
        const res = await fetch('/api/profile/update', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ bio, avatar_color: selectedColor })
        });
        const d = await res.json();
        if (!res.ok) throw new Error(d.message);
        renderUser(d.user);
        triggerToast('Профиль сохранен');
      } catch (err) { triggerToast(err.message); }
    }

    async function apiResetHWID() {
      const token = localStorage.getItem('token');
      const res = await fetch('/api/hwid/reset', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const d = await res.json();
      triggerToast(d.message);
    }

    function downloadClient() {
      const token = localStorage.getItem('token');
      window.location.href = `/api/download-loader?token=${token}`;
    }

    function apiLogout() {
      localStorage.removeItem('token');
      document.getElementById('dashboard-screen').style.display = 'none';
      document.getElementById('auth-screen').style.display = 'flex';
    }

    // === ФОРУМ ===
    async function loadThreads() {
      const res = await fetch('/api/forum/threads');
      const d = await res.json();
      const c = document.getElementById('forum-threads-list');
      c.innerHTML = '';

      d.threads.forEach(t => {
        const div = document.createElement('div');
        div.className = 'forum-item';
        div.onclick = () => openThread(t.id);
        div.innerHTML = `
          <div>
            <div style="font-weight: 600; font-size: 15px;">${t.title}</div>
            <div class="text-muted" style="font-size: 12px;">Автор: ${t.author} • ${new Date(t.created_at).toLocaleDateString()}</div>
          </div>
          <div class="ticket-badge">${t.replies_count} ответов</div>
        `;
        c.appendChild(div);
      });
    }

    function toggleNewThread() {
      const el = document.getElementById('new-thread-form');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    async function apiCreateThread() {
      const token = localStorage.getItem('token');
      const title = document.getElementById('t-title').value;
      const content = document.getElementById('t-content').value;

      const res = await fetch('/api/forum/threads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ title, content })
      });
      if (res.ok) {
        document.getElementById('t-title').value = '';
        document.getElementById('t-content').value = '';
        toggleNewThread();
        loadThreads();
      }
    }

    async function openThread(id) {
      activeThreadId = id;
      const res = await fetch(`/api/forum/threads/${id}`);
      const d = await res.json();

      document.getElementById('forum-index').style.display = 'none';
      document.getElementById('forum-view').style.display = 'block';
      document.getElementById('view-t-title').innerText = d.thread.title;

      const c = document.getElementById('view-t-posts');
      c.innerHTML = `
        <div class="profile-card">
          <div class="text-muted" style="font-size: 12px; margin-bottom: 6px;">${d.thread.author}</div>
          <div>${d.thread.content}</div>
        </div>
      `;

      (d.thread.posts || []).forEach(p => {
        const postDiv = document.createElement('div');
        postDiv.className = 'profile-card';
        postDiv.innerHTML = `
          <div class="text-muted" style="font-size: 12px; margin-bottom: 6px;">${p.author}</div>
          <div>${p.text}</div>
        `;
        c.appendChild(postDiv);
      });
    }

    function backToThreads() {
      activeThreadId = null;
      document.getElementById('forum-view').style.display = 'none';
      document.getElementById('forum-index').style.display = 'block';
      loadThreads();
    }

    async function apiReplyThread() {
      const token = localStorage.getItem('token');
      const text = document.getElementById('reply-text').value;

      const res = await fetch(`/api/forum/threads/${activeThreadId}/reply`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ text })
      });
      if (res.ok) {
        document.getElementById('reply-text').value = '';
        openThread(activeThreadId);
      }
    }

    // === САППОРТ / ТИКЕТЫ ===
    async function apiSendTicket() {
      const token = localStorage.getItem('token');
      const subject = document.getElementById('ticket-subj').value;
      const message = document.getElementById('ticket-msg').value;

      if (!subject || !message) return triggerToast('Заполните все поля');

      const res = await fetch('/api/support/ticket', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ subject, message })
      });
      const d = await res.json();
      if (res.ok) {
        document.getElementById('ticket-subj').value = '';
        document.getElementById('ticket-msg').value = '';
        triggerToast('Вопрос отправлен');
        loadTickets();
      }
    }

    async function loadTickets() {
      const token = localStorage.getItem('token');
      const res = await fetch('/api/support/my-tickets', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const d = await res.json();
      const c = document.getElementById('tickets-list');
      c.innerHTML = '';

      if (d.tickets.length === 0) {
        c.innerHTML = '<p class="text-muted">Активных обращений нет.</p>';
        return;
      }

      d.tickets.forEach(t => {
        const item = document.createElement('div');
        item.style.padding = '12px 0';
        item.style.borderBottom = '1px solid var(--border)';
        item.innerHTML = `
          <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
            <span class="mono" style="font-weight: 600;">${t.subject}</span>
            <span class="ticket-badge">${t.status}</span>
          </div>
          <div class="text-muted" style="font-size: 13px;">${t.message}</div>
          ${t.reply ? `<div style="margin-top: 8px; color: var(--accent-bright); font-size: 13px;">Ответ команды: ${t.reply}</div>` : ''}
        `;
        c.appendChild(item);
      });
    }
  </script>
</body>
</html>
